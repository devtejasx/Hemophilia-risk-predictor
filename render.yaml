services:
  - type: web
    name: hemophilia-risk-predictor-api
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: "bash build.sh"
    startCommand: "uvicorn backend_api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # Set in the Render dashboard. Never commit a value here.
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
